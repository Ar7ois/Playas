<style>
/* VOICE work: formulario de campo claro y amable, con la identidad visual marina
   IDEA un cuadernillo de playa: tarjetas blancas sobre fondo de arena, cielo y olas
   PICTURE el propio formulario; iconos de línea marinos identifican cada apartado
   COLOUR azul marino dominante, turquesa de apoyo, amarillo sol como acento, arena y cielo
   TYPE Nunito redondeada con respaldo del sistema (funciona sin internet)
   LAYOUT una columna de lectura; en escritorio el menú usa dos columnas de tarjetas */
:root{color-scheme:light dark;
--bg:light-dark(#f7fafc,#0a1a26);--card:light-dark(#fff,#10283a);--ink:light-dark(#0f2a3d,#e8f3fa);--mut:light-dark(#566c7c,#a8bfce);
--line:light-dark(#d4e5ee,#244257);--g:light-dark(#0b5d8a,#7cc9f7);--gd:light-dark(#08476a,#b5e2fb);--v:light-dark(#0c7f7a,#18b7b0);--on:light-dark(#fff,#06202f);
--d:light-dark(#ffbe45,#ffbe45);--dl:light-dark(#fbf1e1,#183446);--soft:light-dark(#e6f4fb,#173a50);--sea:#0b5d8a;--teal:#18b7b0;--sun:#ffbe45;--bad:light-dark(#b42318,#ff8a7a);--badbg:light-dark(#fff1ef,#3a1f1b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1440 900%22 preserveAspectRatio=%22none%22 fill=%22none%22%3E%3Cdefs%3E%3ClinearGradient id=%22f%22 x2=%221%22 y2=%221%22%3E%3Cstop stop-color=%22%23F6E2C2%22/%3E%3Cstop offset=%22.42%22 stop-color=%22%23F7FAFC%22/%3E%3Cstop offset=%221%22 stop-color=%22%237CC9F7%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%221440%22 height=%22900%22 fill=%22url(%23f)%22/%3E%3Cpath fill=%22%237CC9F7%22 opacity=%22.35%22 d=%22M0 0 H1440 V198.0 Q1080.0 306.0 720.0 117.0 T0 72.0Z%22/%3E%3Cpath fill=%22%2318B7B0%22 opacity=%22.22%22 d=%22M0 774.0 Q432.0 648.0 792.0000000000001 774.0 T1440 720.0 V900 H0Z%22/%3E%3Cpath fill=%22%23F6E2C2%22 opacity=%22.8%22 d=%22M0 846.0 Q576.0 747.0 979.2 864.0 T1440 801.0 V900 H0Z%22/%3E%3C/svg%3E") center/cover no-repeat;pointer-events:none}
:root[data-theme=dark] body::before{opacity:.1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body::before{opacity:.1}}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(100deg,#0b5d8a,#0a6c9c 60%,#0f8aa6);color:#fff;box-shadow:0 2px 0 var(--teal);padding:10px max(16px,3vw);display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.top b{font-weight:900;font-size:17px;flex:1;display:flex;align-items:center;gap:10px}
.logo{flex:none;height:46px;padding:3px 10px;border-radius:12px;background:#fff;display:grid;place-items:center}.logo svg{height:40px;width:auto;display:block}
.ttl{line-height:1.2}
.top .who{font-size:14px;opacity:.92}
.nav{display:flex;gap:8px;flex-wrap:wrap}.nav .sm{display:none}
.top button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;padding:7px 12px;min-height:40px;cursor:pointer;font-size:14px}
.net{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.bar{height:6px;background:color-mix(in srgb,#7cc9f7 45%,transparent)}.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
main{max-width:860px;margin:0 auto;padding:20px max(16px,3vw) 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(11,93,138,.06);padding:20px 22px;margin-bottom:14px}
.hcard{border-top:8px solid var(--sea)}.hcard.v{border-top-color:var(--teal)}
.kick{font-size:14px;color:var(--mut);margin:0 0 4px}
h1{font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-.01em;font-weight:900;color:var(--gd);margin:0 0 10px;text-wrap:balance}
h2{font-size:21px;line-height:1.2;margin:0 0 8px;color:var(--g);font-weight:800}
h3{font-size:18px;margin:0 0 6px;line-height:1.3}
p{margin:0 0 10px}
.note{font-size:14px;color:var(--mut)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--dl);color:var(--gd);margin:4px 6px 0 0}
.pill.v{color:var(--v)}.pill.ok{background:var(--v);color:var(--on)}.pill.bad{background:var(--badbg);color:var(--bad)}
ul.l,ol.l{margin:6px 0 10px;padding-left:22px}ul.l li,ol.l li{margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.apt{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--sea);border-radius:16px;padding:16px 84px 16px 18px;cursor:pointer;min-height:150px;box-shadow:0 1px 2px rgba(11,93,138,.06)}
.ico{flex:none;width:56px;height:56px;border-radius:50%;background:#f7fafc;border:1.5px solid #d4e5ee;display:grid;place-items:center}.ico svg{width:36px;height:36px}
.apt .ico{position:absolute;right:16px;top:16px}
.ico.big{width:72px;height:72px;float:right;margin:0 0 8px 12px}.ico.big svg{width:46px;height:46px}
.apt:hover{border-color:var(--d);border-left-color:var(--g)}
.apt.v{border-left-color:var(--teal)}
.apt .n{font-size:13px;font-weight:800;color:var(--gd)}
.apt h3{margin:0;font-size:19px}
.apt .s{font-size:14px;color:var(--mut);flex:1}
.apt.lock{opacity:.55;cursor:not-allowed}
.apt .st{font-size:13px;font-weight:700}
.avbtn{display:flex;width:100%;align-items:center;gap:14px;text-align:left;cursor:pointer;border-left:8px solid var(--sun)}.avbtn>span:nth-child(2){flex:1}
.avbtn b{font-size:18px}.avbtn .go{font-weight:800;color:var(--g);flex:none}
.pcard h3{margin:0}.pcard.act{border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 35%,transparent)}
.phead{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl{font-weight:700;font-size:15px}.tbar{display:flex;align-items:center;gap:10px;white-space:nowrap}.tbar .pb{flex:1;margin:0;max-width:260px}
@media(max-width:600px){.trow{grid-template-columns:minmax(0,1fr) auto}.trow .tl{grid-column:1/-1}}
.hero{overflow:hidden}.heroimg{float:right;width:230px;margin:-2px -4px 10px 18px}.heroimg svg{width:100%;height:auto;display:block}
@media(max-width:600px){.heroimg{float:none;display:block;width:200px;margin:0 0 10px}}
.avance summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pb{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.pb i{display:block;height:100%}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}
.btn{min-height:46px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--g);background:var(--g);color:var(--on);font-weight:700;cursor:pointer;font-size:15px}
.btn.sec{background:transparent;color:var(--g)}
.btn.ghost{border-color:var(--line);background:var(--card);color:var(--ink);font-weight:600}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--g);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:8px;min-height:40px;font-size:15px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.steps span{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.steps span.on{background:var(--g);border-color:var(--g);color:var(--on);font-weight:700}
.steps span.ok{border-color:var(--v);color:var(--v)}
.steps button{font:inherit;font-size:14px;min-width:36px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.steps button.on{background:var(--g);border-color:var(--g);color:var(--on);font-weight:700}
.steps button.ok{border-color:var(--v);color:var(--v)}
.steps button:hover{border-color:var(--g)}
.autov{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:#f7fafc}
.autov b{font-size:18px}
.pillbtn{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.phead .pill{white-space:nowrap;align-self:flex-start}
.chipbtn{display:inline-block;text-align:left;white-space:normal}
.pendrow td{background:#fff8ec}
.chipbtn{font:inherit;font-size:13px;margin:4px 4px 0 0;padding:4px 10px;border-radius:99px;border:1px solid var(--sun);background:#fff;color:var(--ink);cursor:pointer}
.fld{margin:14px 0 0;padding:2px 0}
.fld.bad{background:var(--badbg);border-radius:10px;padding:8px 10px;margin-left:-10px;margin-right:-10px}
.fhead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.fhead .lab{font-size:15px;font-weight:700}
.req{color:var(--g)}
.na{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer;min-height:34px;color:var(--mut);flex:none}
.na.on{background:var(--mut);border-color:var(--mut);color:var(--card)}
.lockmsg{font-size:13px;color:var(--mut);font-style:italic}
.err{font-size:13px;color:var(--bad);margin-top:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:15px;background:var(--card)}
.chips input{accent-color:#0b5d8a;width:18px;height:18px;margin:0}
.chips label:has(input:checked){border-color:var(--g);background:var(--soft);font-weight:600}
.chips label:has(input:disabled){opacity:.4;cursor:not-allowed}
.chips.sc label{min-width:54px;justify-content:center}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-height:46px}
input:disabled,select:disabled,textarea:disabled{opacity:.5;background:var(--dl)}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.chips label:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--d) 70%,transparent);outline-offset:1px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.q .num{font-size:13px;font-weight:800;color:var(--gd);background:var(--dl);border-radius:6px;padding:2px 8px;margin-right:8px}
.q .stem{font-weight:600;color:var(--v);margin:6px 0 4px}
.q .why{font-size:14px;color:var(--mut)}
.q.done{border-left:6px solid var(--v)}
.q.bad{border-left:6px solid var(--bad)}
.ref{display:grid;place-items:center;aspect-ratio:16/7;max-height:240px;width:100%;border:2px dashed #b9dcea;border-radius:14px;background:linear-gradient(180deg,var(--soft),var(--dl));color:var(--mut);font-size:14px;margin:10px 0 4px;overflow:hidden;text-align:center;padding:8px}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref.ok{aspect-ratio:auto;max-height:none;border:0;background:var(--dl);padding:0;position:relative}.ref.ok img{width:100%;height:auto;max-height:380px;object-fit:contain;border-radius:14px}
.ref.ok::after{content:'Imagen de referencia';position:absolute;left:10px;bottom:10px;background:rgba(11,93,138,.88);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.ref svg{width:44px;height:44px;margin:0 auto 4px;display:block}
.dep{border-left:3px solid var(--line);padding-left:14px;margin-top:6px}
.frows{display:grid;gap:10px;margin-top:10px}.frow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px}.frow img{width:110px;height:110px;object-fit:cover;border-radius:8px;display:block}.frow textarea{min-height:60px}
.lnk{background:none;border:0;color:var(--bad);font-weight:700;cursor:pointer;padding:4px 0;font-size:13px}
@media(max-width:420px){.frow{grid-template-columns:84px minmax(0,1fr)}.frow img{width:84px;height:84px}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs figure{margin:0;position:relative;width:92px}
.thumbs img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs figcaption{font-size:11px;color:var(--mut);text-align:center}
.thumbs button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.up{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1.5px dashed var(--g);border-radius:10px;color:var(--g);font-weight:700;cursor:pointer}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.persona{border:1.5px solid var(--sun);background:var(--dl);border-radius:12px;padding:12px 14px;margin-top:10px}
.pend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px solid var(--d);background:var(--dl);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.alert{border:1.5px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.okbox{border:1.5px solid var(--v);color:var(--v);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.meta div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.meta b{display:block;font-size:22px;color:var(--g);font-variant-numeric:tabular-nums}
.meta span{font-size:13px;color:var(--mut)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b5d8a;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:10px 18px;border-radius:10px;font-size:15px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1}
.hide{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.top b{font-size:14px;flex:1 1 auto}.logo{height:38px;padding:2px 8px}.logo svg{height:33px}.top .net{font-size:11px}.nav{flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.nav button{padding:6px 4px;min-height:40px;font-size:13px}.lg{display:none}.nav .sm{display:inline}.top .who{flex-basis:100%;order:3;font-size:13px}.card{padding:18px 16px}.row2{grid-template-columns:minmax(0,1fr)}.fld.bad{margin-left:-6px;margin-right:-6px;padding:8px 6px}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}.stack td::before{content:attr(data-l);font-size:13px;color:var(--mut)}.stack .pendrow td{display:block;padding:8px 10px;border-radius:10px}.stack .pendrow td::before{display:none}}
@media(prefers-reduced-motion:reduce){.bar i,.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <b><span class="logo" id="logo"></span><span class="ttl">Cuestionario de Caracterización de Playas</span></b>
  <span class="net" id="net">Sin conexión</span>
  <span class="net hide" id="gpsPill">● Grabando recorrido</span>
  <nav class="nav"><button type="button" id="bMenu">Menú</button><button type="button" id="bGps"><span class="lg">Recorrido </span>GPS</button><button type="button" id="bPlaya"><span class="lg">Elegir playa</span><span class="sm">Playa</span></button><button type="button" id="bAvance">Avance<span class="lg"> por playa</span></button></nav>
  <span class="who" id="who"></span>
</header>
<div class="bar"><i id="prog"></i></div>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<script>
{
const DATA={"apt":[{"c":"B","t":"B. Espacio funcional, accesos, movilidad y zonificación","i":"Cada zona, acceso o elemento deberá levantarse en campo y documentarse con evidencia verificable, conforme a su naturaleza y al apartado en que se registre.","subs":[{"c":"B.1.1","t":"B.1.1. Zonas funcionales de uso, estancia y servicios","i":"Este subapartado registra las zonas que permiten el uso público de la playa. Su propósito es identificar qué zonas existen, dónde se ubican y cómo contribuyen al aprovechamiento recreativo del espacio.","it":[[1,"Acceso público","Garantizar puntos de entrada a la playa desde el exterior, libres, visibles, seguros y sin condicionamientos indebidos.","¿El tramo cuenta con acceso público a la playa, libre, visible y sin condicionamientos indebidos?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile","Waypoint GPS"]],[2,"Estacionamiento","Ordenar la llegada vehicular y evitar invasión u obstrucción de accesos y zonas de playa.","¿Existe estacionamiento que ordene la llegada vehicular sin invadir ni obstruir accesos o zonas de playa?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[3,"Tránsito libre","Mantener una franja continua dentro de la playa para la circulación peatonal sin obstrucciones.","¿Existe una franja continua de tránsito peatonal libre de obstrucciones dentro de la playa?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[4,"Estancia recreativa","Ordenar descanso, sombra y permanencia.","¿Existe una zona de estancia recreativa destinada al descanso, la sombra y la permanencia?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[5,"Baño seguro / contacto con agua","Definir dónde se permite nadar o entrar al mar.","¿Existe una zona definida de baño seguro o de contacto con el agua?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[6,"Actividades acuáticas","Delimitar la práctica de deportes acuáticos como acuamotos, banana, surf u otras actividades similares.","¿Existe una zona delimitada para actividades acuáticas (acuamotos, banana, surf u otras similares)?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[8,"Baños y regaderas","Concentrar sanitarios, regaderas y servicios básicos para usuarios.","¿Existe una zona que concentre baños y regaderas para las personas usuarias?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[10,"Prestadores y comercio autorizado","Ordenar actividad económica sin privatizar la playa.","¿Existe una zona para prestadores y comercio autorizado que ordene la actividad económica sin privatizar la playa?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[11,"Proveeduría","Definir puntos y horarios para abastecimiento, carga y descarga de insumos.","¿Existen puntos y horarios definidos de proveeduría para abastecimiento, carga y descarga de insumos?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[12,"Línea de costa","Delimitar la superficie útil de playa y ordenar los usos frente al mar.","¿Está delimitada la línea de costa que define la superficie útil de playa y ordena los usos frente al mar?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]]]},{"c":"B.1.2","t":"B.1.2. Zonas excluidas o no usables para recreación","i":"Este subapartado identifica áreas o condiciones que reducen, restringen o impiden el uso recreativo efectivo de la playa, ya sea por protección ambiental, escurrimientos, infraestructura, ocupación indebida o restricciones físicas del sitio.","it":[[13,"Conservación / protección ecosistémica","Proteger dunas, vegetación, fauna, zonas erosionadas o ambientalmente sensibles.","¿Existen zonas de conservación o protección ecosistémica (dunas, vegetación, fauna, zonas erosionadas o sensibles) que excluyan el uso recreativo?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]],[16,"Privatización / invasión","Detectar restricciones indebidas y valorar acciones para recuperar el uso público.","¿Se detecta privatización o invasión que restrinja indebidamente el uso público de la playa?",1,["Foto","Ortofoto","Track GPS","Archivo KML / Shapefile"]]]},{"c":"B.2","t":"B.2. Ordenamiento operativo de flujos, mobiliario y logística de acceso","i":"Este apartado valora si la playa cuenta con mecanismos para organizar la circulación, controlar flujos, distribuir mobiliario, ordenar estacionamientos y gestionar carga/descarga, evitando saturación, conflictos de uso y obstrucciones.","it":[[18,"Aplicación operativa de la zonificación","Verificar si las zonas definidas se respetan y funcionan en campo.","¿Las zonas definidas se respetan y funcionan en campo?",1,["Evidencia documental","Foto","Waypoint GPS"]],[20,"Distribución de mobiliario en playa","Ordenar mobiliario para mantener áreas libres, tránsito y estancia adecuada.","¿El mobiliario en playa está distribuido de modo que mantiene áreas libres, tránsito y estancia adecuada?",1,["Evidencia documental","Foto","Waypoint GPS"]],[23,"Áreas de carga, descarga y abastecimiento","Organizar la logística de servicios sin afectar accesos, tránsito o uso recreativo.","¿Existen áreas de carga, descarga y abastecimiento que no afecten accesos, tránsito ni uso recreativo?",1,["Evidencia documental","Foto","Waypoint GPS"]]]},{"c":"B.3","t":"B.3. Accesibilidad y conectividad","i":"Este apartado valora si la playa está conectada de forma segura, legible e incluyente con su entorno urbano, natural o turístico, considerando accesos físicos, cruces peatonales, transporte público, senderos, pasarelas y condiciones de accesibilidad universal.","it":[[24,"Conectividad con el entorno urbano, natural o turístico","Valorar la relación de la playa con vialidades, andadores, malecones, zonas hoteleras, comunidades o espacios naturales cercanos.","¿La playa está conectada con vialidades, andadores, malecones, zonas hoteleras, comunidades o espacios naturales cercanos?",1,["Evidencia documental","Foto","Waypoint GPS"]],[25,"Senderos y pasarelas de conexión","Verificar continuidad peatonal entre accesos, estacionamientos, paraderos, servicios y zonas de playa.","¿Existen senderos y pasarelas con continuidad peatonal entre accesos, estacionamientos, paraderos, servicios y zonas de playa?",1,["Evidencia documental","Foto","Waypoint GPS"]],[26,"Accesos físicos a la playa: rampas, escaleras, senderos y puentes","Evaluar la condición, seguridad y funcionalidad de las infraestructuras de ingreso a la playa.","¿Existen accesos físicos a la playa (rampas, escaleras, senderos o puentes)?",1,["Evidencia documental","Foto","Waypoint GPS"]],[29,"Elementos de accesibilidad universal: barandales, baños accesibles, señalética y apoyos de orientación","Valorar si la playa permite uso seguro, incluyente y comprensible para distintos perfiles de usuarios.","¿Existen elementos de accesibilidad universal (barandales, baños accesibles, señalética y apoyos de orientación)?",1,["Evidencia documental","Foto","Waypoint GPS"]]]}]},{"c":"C","t":"C. Condición física, ambiental, calidad y protección costera","i":"Cada componente, medida o parámetro registrado en el apartado C deberá levantarse o verificarse en campo y documentarse con evidencia verificable, conforme al tipo de información que corresponda.","subs":[{"c":"C.1","t":"C.1. Perfil físico y natural","i":"Este apartado identifica las condiciones físicas y naturales de la playa que pueden influir en su uso recreativo, seguridad, disponibilidad de superficie, restricciones de tránsito y operación general del sitio.","it":[[31,"Erosión","Identificar pérdida de superficie útil y restricciones de uso.","¿Se observa erosión que implique pérdida de superficie útil o restricciones de uso?",1,["Observación directa","Foto"]],[34,"Bancos de arena","Reconocer cambios en la superficie disponible y en la distribución de usos.","¿Existen bancos de arena que modifiquen la superficie disponible o la distribución de usos?",1,["Observación directa","Foto"]],[35,"Formaciones rocosas","Identificar barreras físicas, restricciones de tránsito y zonas de riesgo.","¿Existen formaciones rocosas que constituyan barreras físicas, restricciones de tránsito o zonas de riesgo?",1,["Observación directa","Foto"]]]},{"c":"C.2","t":"C.2. Ecosistemas y componentes ecológicos","i":"Este apartado registra los componentes naturales, ecológicos, paisajísticos o patrimoniales presentes en la playa y su entorno, con el propósito de valorar su estado de conservación, relevancia ambiental y compatibilidad con el uso recreativo.","it":[[38,"Ecosistemas y formaciones naturales costeras","Valorar la presencia y estado de conservación de manglar, dunas, matorral costero, humedales, selvas, marismas, fanerógamas marinas u otros componentes naturales relevantes.","¿Existen ecosistemas o formaciones naturales costeras (manglar, dunas, matorral costero, humedales, selvas, marismas, fanerógamas marinas u otros)?",0,["Observación directa","Foto"]]]},{"c":"C.3","t":"C.3. Vulnerabilidad y protección civil en playas","i":"Este apartado valora si la playa cuenta con medidas preventivas, protocolos, señalización y capacidades básicas de respuesta ante riesgos naturales, emergencias, alta afluencia de visitantes o fenómenos meteorológicos.","it":[[46,"Señalética de riesgo visible para el visitante","Informar peligros, restricciones y medidas de seguridad.","¿Existe señalética de riesgo visible para el visitante?",0,["Evidencia documental","Foto (cuando sea verificable en sitio)"]]]}]},{"c":"D","t":"D. Servicios al visitante, higiene, seguridad, información y confort","i":"Cada elemento registrado en el apartado D deberá verificarse en campo y documentarse con registro fotográfico en alta resolución, de manera individual, conforme al componente evaluado y a la condición observada.","subs":[{"c":"D.1","t":"D.1. Servicios básicos al visitante","i":"Este apartado registra los servicios disponibles para orientar, atender y apoyar al visitante durante su estancia en la playa, considerando información, hidratación, alimentos, asistencia básica, limpieza y otros servicios de apoyo.","it":[[50,"Módulos de información","Orientar la consulta y atención básica al visitante.","¿Existen módulos de información para la consulta y atención básica al visitante?",1,["Foto"]],[53,"Información sobre riesgos y reglamento","Prevenir incidentes y ordenar conductas permitidas o restringidas.","¿Se brinda información sobre riesgos y reglamento?",1,["Foto"]],[65,"Barrido y limpieza de playa","Mantener arena y áreas de estancia en condiciones adecuadas.","¿Se realiza barrido y limpieza de la playa?",1,["Foto"]],[66,"Limpieza de espejo de agua","Retirar residuos o elementos que afecten el uso recreativo del mar.","¿Se realiza limpieza del espejo de agua?",1,["Foto"]]]},{"c":"D.2","t":"D.2. Salud e higiene","i":"Este apartado valora la existencia y condición de servicios e infraestructura sanitaria que permiten mantener la playa limpia, segura y adecuada para el uso público, incluyendo sanitarios, regaderas, manejo de residuos y posibles descargas.","it":[[67,"Sanitarios públicos","Cubrir necesidades básicas de higiene y confort del visitante.","¿Existen sanitarios públicos?",1,["Foto"]],[68,"Regaderas / lavapiés","Facilitar aseo posterior al uso de playa.","¿Existen regaderas o lavapiés?",1,["Foto"]],[69,"Contenedores de basura","Concentrar residuos y mantener limpia el área de uso público.","¿Existen contenedores de basura?",1,["Foto"]],[70,"Manejo de residuos","Asegurar recolección, separación y disposición adecuada.","¿Existe manejo de residuos (recolección, separación y disposición)?",1,["Foto"]],[71,"Descargas al mar (conocidas)","Identificar puntos de riesgo sanitario y ambiental.","¿Se identifican descargas al mar conocidas?",1,["Foto"]]]},{"c":"D.3","t":"D.3. Seguridad","i":"Este apartado identifica los elementos, personal, infraestructura y mecanismos de vigilancia, prevención y respuesta que contribuyen a reducir riesgos y atender emergencias en la playa.","it":[[72,"Torres / puestos de salvavidas","Facilitar vigilancia y respuesta rápida ante emergencias acuáticas.","¿Existen torres o puestos de salvavidas?",1,["Foto"]],[73,"Cobertura de salvavidas (personal)","Asegurar presencia operativa para supervisión y rescate.","¿Existe cobertura de salvavidas (personal) en la playa?",1,["Foto"]],[74,"Horario de operación de salvavidas","Definir la franja de vigilancia activa en playa.","¿Existe un horario de operación de salvavidas definido?",1,["Foto"]],[76,"Banderas e indicadores de riesgo visibles","Comunicar el estado del mar y el nivel de riesgo para bañistas.","¿Existen banderas e indicadores de riesgo visibles?",1,["Foto"]],[78,"Balizas y bolardos","Delimitar áreas de tránsito, restricción o protección.","¿Existen balizas y bolardos que delimiten áreas de tránsito, restricción o protección?",1,["Foto"]],[79,"Módulos de seguridad / vigilancia fija","Concentrar atención, monitoreo y reacción operativa.","¿Existen módulos de seguridad o vigilancia fija?",1,["Foto"]]]},{"c":"D.4","t":"D.4. Información y señalética","i":"Este apartado valora si la playa cuenta con información visible, clara y útil para orientar al visitante, ordenar recorridos, comunicar reglas, advertir riesgos y facilitar el uso seguro del espacio.","it":[[84,"Información de horarios de uso y operación","Informar horarios, restricciones temporales y condiciones generales de uso.","¿Existe información de horarios de uso y operación?",1,["Foto"]],[85,"Señalamientos horizontales","Ordenar flujos, recorridos y zonas de uso sobre el espacio físico.","¿Existen señalamientos horizontales?",1,["Foto"]],[86,"Señalamientos verticales de orientación","Comunicar direcciones, accesos, servicios y recorridos principales.","¿Existen señalamientos verticales de orientación?",1,["Foto"]],[87,"Señalética de seguridad y reglamentación","Informar riesgos, reglas básicas, restricciones y protocolos de emergencia.","¿Existe señalética de seguridad y reglamentación?",1,["Foto"]],[88,"Mapa físico de playa","Mostrar acceso    ...ks.flatMap(k=>{const a=S.regs[k].a;return ((S.regs[k].tracks)||[]).flatMap((t,i)=>t.map((q,j)=>[a.A01,a.A07,i+1,j+1,fdt(q.t),q.lat,q.lon,q.acc]))})];
  return T;
}
const toCSV=rows=>rows.map(r=>r.map(csvC).join(',')).join('\n');
function exportar(f){
  if(f==='json')return saveFile('respaldo_caracterizacion_playas_'+stamp()+'.json',JSON.stringify({regs:S.regs,ents:S.ents,fotos:FOT},null,1));
  const T=tablas();
  if(f==='xlsx'){
    if(!window.XLSX){toast('El generador de Excel no está disponible sin conexión en este momento; usa los CSV');$('#otros')&&($('#otros').open=true);return}
    const wb=XLSX.utils.book_new();
    [['Matriz_Turno','Matriz_Turno'],['BD_A','BD_A'],['Percepcion','Percepción'],['Fotos','Fotos'],['Recorrido_GPS','Recorrido GPS']].forEach(([k,n])=>{const ws=XLSX.utils.aoa_to_sheet(T[k]);ws['!cols']=T[k][0].map((h,i)=>({wch:Math.min(48,Math.max(10,String(h).length+2,...T[k].slice(1,60).map(r=>String(r[i]??'').length+1)))}));ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,T[k].length-1),c:T[k][0].length-1}})};XLSX.utils.book_append_sheet(wb,ws,n)});
    return saveFile('Caracterizacion_Playas_'+stamp()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}));
  }
  const map={mt:['Matriz_Turno','Matriz_Turno_46_items.csv'],bd:['BD_A','BD_A_registros.csv'],pe:['Percepcion','Percepcion_respuestas.csv'],fo:['Fotos','Fotos_coordenadas.csv'],gp:['Recorrido_GPS','Recorrido_GPS_puntos.csv']}[f];
  if(map)return saveFile(map[1],toCSV(T[map[0]]));
}

// ===== Conexión y arranque =====
$('#logo').innerHTML=ICON.logo;
const net=()=>{const on=navigator.onLine;$('#net').textContent=on?'En línea':'Sin conexión';$('#net').style.background=on?'rgba(255,255,255,.18)':'rgba(0,0,0,.25)'};
const autoSync=()=>{if(S.cfg.url&&navigator.onLine&&FOT.some(f=>f.estado!=='subida'))syncFotos(true)};
window.addEventListener('online',()=>{net();autoSync()});window.addEventListener('offline',net);net();
(async()=>{IDB=await idbOpen();if(IDB)FOT=await idbAll();render(false);if(conectado){save();toast('Cuestionario conectado con Drive')}autoSync()})();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render(false);
}
</script>
